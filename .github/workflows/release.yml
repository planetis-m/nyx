name: release

# Builds nyx with Nimony's native backend (`nimony n`: arkham + nifasm, no C
# compiler or system linker involved) on one native runner per target, and on a
# `v*` tag publishes the archives, SHA256SUMS and the install scripts as a
# GitHub Release. `workflow_dispatch` builds and tests without releasing.
#
# Targets are the ones nativenif can emit for: linux/amd64, linux/arm64,
# macosx/arm64 and windows/amd64. There is no macOS x86_64 or Windows ARM64
# backend, so those are not built.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  # nyx needs the stdlib ports on this branch (std/files, os.sleep, tempfiles,
  # symlinks); move to nim-lang/nimony once they are merged there.
  NIMONY_REPO: https://github.com/planetis-m/nimony
  NIMONY_COMMIT: 0a20752c887064f0befd01961f7e99a4898b92e0
  NATIVENIF_REPO: https://github.com/nim-lang/nativenif
  NATIVENIF_COMMIT: d2fb4ce249734766ec4b80b5fae89528c5b561d4

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,    os: linux,   arch: amd64, cpu: amd64, ext: tar.gz }
          - { runner: ubuntu-24.04-arm, os: linux,   arch: arm64, cpu: arm64, ext: tar.gz }
          - { runner: macos-latest,     os: macos,   arch: arm64, cpu: arm64, ext: tar.gz }
          - { runner: windows-latest,   os: windows, arch: amd64, cpu: amd64, ext: zip }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      # Before any checkout: the logo is embedded byte for byte.
      - run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          path: nyx

      - name: Clone nimony and nativenif
        # nativenif must sit at `../nativenif` relative to nimony. hastur moves a
        # detached or CI checkout to nimony's own `src/nativenif.commit`, but
        # leaves a local branch alone outside CI, so the clone gets a branch and
        # the build below runs without `CI` set.
        run: |
          clone() {
            git init -q "$1"
            git -C "$1" fetch -q --depth 1 "$2" "$3"
            git -C "$1" checkout -q -B release FETCH_HEAD
          }
          clone nimony "$NIMONY_REPO" "$NIMONY_COMMIT"
          clone nativenif "$NATIVENIF_REPO" "$NATIVENIF_COMMIT"

      - name: Restore the nimony toolchain
        id: toolchain
        uses: actions/cache@v4
        with:
          path: nimony/bin
          key: nimony-${{ matrix.os }}-${{ matrix.arch }}-${{ env.NIMONY_COMMIT }}-${{ env.NATIVENIF_COMMIT }}

      - name: Install MinGW (Windows)
        # Only for building the toolchain with Nim; `nimony n` itself needs no C
        # compiler. Same bundle nimony's own CI uses.
        if: runner.os == 'Windows' && steps.toolchain.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o mingw.7z "https://github.com/brechtsanders/winlibs_mingw/releases/download/14.2.0posix-19.1.7-12.0.0-msvcrt-r3/winlibs-x86_64-posix-seh-gcc-14.2.0-llvm-19.1.7-mingw-w64msvcrt-12.0.0-r3.7z"
          7z x -y mingw.7z -o"$RUNNER_TEMP" > /dev/null
          echo "$RUNNER_TEMP/mingw64/bin" >> "$GITHUB_PATH"

      - name: Install Nim devel
        if: steps.toolchain.outputs.cache-hit != 'true'
        uses: alaviss/setup-nim@0.1.1
        with:
          path: nim
          version: devel
          architecture: ${{ matrix.cpu }}

      - name: Overlay current Nim compiler sources
        # nifler compiles Nim's parser against the host's `compiler/`, and the
        # nightly can lag devel; nimony's CI does the same.
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: |
          git clone -q --depth 1 https://github.com/nim-lang/Nim nim-src
          cp -a nim-src/compiler/. nim/compiler/
          cp -a nim-src/lib/packages/docutils/. nim/lib/packages/docutils/

      - name: Build the nimony toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        working-directory: nimony
        run: |
          env -u CI nim c -r src/hastur/hastur --release build all
          test "$(git -C ../nativenif rev-parse HEAD)" = "$NATIVENIF_COMMIT"

      - name: Build nyx
        working-directory: nyx
        run: |
          exe=""
          if [ "${{ runner.os }}" = Windows ]; then exe=.exe; fi
          ../nimony/bin/nimony n -d:release -o:"dist/nyx$exe" src/nyx.nim
          # nifasm leaves room for a signature but does not sign, and arm64
          # macOS refuses to run unsigned code: sign ad hoc.
          if [ "${{ runner.os }}" = macOS ]; then codesign -s - -f dist/nyx; fi
          ./dist/nyx$exe -h

      - name: Package
        id: package
        working-directory: nyx
        run: |
          name="nyx-${{ matrix.os }}-${{ matrix.arch }}.${{ matrix.ext }}"
          cp README.md dist/
          if [ "${{ matrix.ext }}" = zip ]; then
            (cd dist && 7z a -tzip "../$name" nyx.exe README.md > /dev/null)
          else
            COPYFILE_DISABLE=1 tar -C dist -czf "$name" nyx README.md
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: nyx/${{ steps.package.outputs.name }}
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp install.sh install.ps1 dist/
          cd dist
          sha256sum nyx-* > SHA256SUMS
          cat SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --generate-notes \
            nyx-* SHA256SUMS install.sh install.ps1

  install-test:
    # Runs the published scripts the way the README tells users to.
    needs: release
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    env:
      NYX_VERSION: ${{ github.ref_name }}
    steps:
      - name: Install with install.sh
        if: runner.os != 'Windows'
        run: |
          curl -fsSL "https://github.com/${{ github.repository }}/releases/download/$NYX_VERSION/install.sh" | sh
          "$HOME/.local/bin/nyx" -h

      - name: Install with install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm "https://github.com/${{ github.repository }}/releases/download/$env:NYX_VERSION/install.ps1" | iex
          & "$env:LOCALAPPDATA\Programs\nyx\nyx.exe" -h
          if ($LASTEXITCODE -ne 0) { exit 1 }
